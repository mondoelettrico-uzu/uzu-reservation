<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>UZU ご予約</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    :root {
      --uzu-yellow: #ffcc00;
      --uzu-dark: #222222;
      --uzu-white: #ffffff;
      --uzu-green: #06c755;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 8px 18px 60px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Noto Sans JP",
        sans-serif;

      background: var(--uzu-yellow);
      color: var(--uzu-dark);
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }


    /* =========================
       LOGO
    ========================== */

    .logo-area {
      text-align: center;
      margin: 0 auto;
    }

    .main-logo {
      display: block;
      width: 100px;
      height: auto;
      margin: 6px auto 2px;
    }


    /* =========================
       TITLE
    ========================== */

    .reservation-title {
      text-align: center;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin: 0 0 6px;
    }

    .lead {
      text-align: center;
      font-size: 14px;
      line-height: 1.8;
      margin: 0 0 18px;
    }


    /* =========================
       FORM CARD
    ========================== */

    .form-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      padding: 25px 20px 27px;

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.08);
    }


    /* =========================
       FIELDS
    ========================== */

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      height: 54px;
      padding: 0 14px;

      border:
        1px solid
        #d8d4ca;

      border-radius: 9px;

      background: #ffffff;
      color: #222222;

      font-size: 16px;

      -webkit-appearance: none;
      appearance: none;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #777777;
    }

    select {
      background-image:
        linear-gradient(
          45deg,
          transparent 50%,
          #555 50%
        ),
        linear-gradient(
          135deg,
          #555 50%,
          transparent 50%
        );

      background-position:
        calc(100% - 20px) 23px,
        calc(100% - 14px) 23px;

      background-size:
        6px 6px,
        6px 6px;

      background-repeat:
        no-repeat;
    }


    /* =========================
       HOLIDAY INFO
    ========================== */

    .holiday-note {
      margin: -9px 0 21px;

      font-size: 12px;
      line-height: 1.7;

      color: #777777;
    }


    /* =========================
       BUTTON
    ========================== */

    .send-button {
      width: 100%;
      height: 60px;
      margin-top: 4px;

      border: none;
      border-radius: 10px;

      background: var(--uzu-green);
      color: #ffffff;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;
    }

    .send-button:disabled {
      opacity: 0.55;
      cursor: default;
    }


    /* =========================
       NOTICE
    ========================== */

    .notice {
      margin-top: 18px;

      font-size: 12px;
      line-height: 1.8;

      color: #666666;
    }


    /* =========================
       ERROR
    ========================== */

    .error {
      display: none;

      margin-top: 16px;
      padding: 13px 14px;

      border-radius: 8px;

      background: #fff0ee;
      color: #b33a2b;

      font-size: 13px;
      line-height: 1.7;
    }


    /* =========================
       SUCCESS
    ========================== */

    .success {
      display: none;

      background:
        rgba(255, 255, 255, 0.95);

      border-radius: 18px;

      margin-top: 20px;
      padding: 40px 22px;

      text-align: center;

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.08);
    }

    .success-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .success-text {
      font-size: 14px;
      line-height: 1.9;
    }

  </style>

</head>


<body>


<div class="container">


  <!-- =========================
       UZU LOGO
  ========================== -->

  <div class="logo-area">

    <img
      src="uzulogo黄色.png"
      class="main-logo"
      alt="UZU FARM & TABLE">

  </div>


  <!-- =========================
       RESERVATION FORM
  ========================== -->

  <div id="formArea">


    <div class="reservation-title">
      ご予約
    </div>


    <div class="lead">
      ご希望の日時をご入力ください。<br>
      店舗からの返信をもって予約確定となります。
    </div>


    <div class="form-card">


      <!-- DATE -->

      <div class="field">

        <label for="date">
          ご希望日
        </label>

        <input
          type="date"
          id="date">

      </div>


      <div class="holiday-note">
        ※土日祝・年末年始はご予約いただけません。
      </div>


      <!-- TIME -->

      <div class="field">

        <label for="time">
          ご希望時間
        </label>

        <select id="time">

          <option value="">
            選択してください
          </option>

          <option value="11:00">
            11:00
          </option>

          <option value="11:30">
            11:30
          </option>

          <option value="12:00">
            12:00
          </option>

          <option value="12:30">
            12:30
          </option>

          <option value="13:00">
            13:00
          </option>

          <option value="13:30">
            13:30
          </option>

          <option value="14:00">
            14:00
          </option>

        </select>

      </div>


      <!-- PEOPLE -->

      <div class="field">

        <label for="people">
          人数
        </label>

        <select id="people">

          <option value="">
            選択してください
          </option>

          <option value="1">1名</option>
          <option value="2">2名</option>
          <option value="3">3名</option>
          <option value="4">4名</option>
          <option value="5">5名</option>
          <option value="6">6名</option>
          <option value="7">7名</option>
          <option value="8">8名</option>
          <option value="9">9名</option>
          <option value="10">10名</option>

        </select>

      </div>


      <!-- NAME -->

      <div class="field">

        <label for="name">
          お名前
        </label>

        <input
          type="text"
          id="name"
          placeholder="例：山田 太郎"
          autocomplete="name">

      </div>


      <!-- SEND -->

      <button
        id="sendButton"
        class="send-button"
        onclick="sendReservation()">

        LINEで予約希望を送信

      </button>


      <div
        id="error"
        class="error">
      </div>


      <div class="notice">

        ※この時点では予約は確定しておりません。<br>
        店舗からの返信をもって予約確定となります。

      </div>


    </div>

  </div>


  <!-- =========================
       SUCCESS
  ========================== -->

  <div
    id="successArea"
    class="success">


    <div class="success-title">
      ご予約希望を送信しました
    </div>


    <div class="success-text">

      ありがとうございます。<br><br>

      店舗で内容を確認後、<br>
      LINEよりご返信いたします。<br><br>

      店舗からの返信をもって<br>
      ご予約確定となります。

    </div>


  </div>


</div>


<script>


  /* =========================
     LIFF
  ========================== */

  const LIFF_ID =
    '2011685472-ftHOwEec';


  async function initializeLiff() {

    try {

      await liff.init({
        liffId: LIFF_ID
      });

    } catch (error) {

      console.error(
        'LIFF initialization failed',
        error
      );

    }

  }


  /* =========================
     DATE MIN
  ========================== */

  const dateInput =
    document.getElementById('date');


  const today =
    new Date();


  const yyyy =
    today.getFullYear();


  const mm =
    String(
      today.getMonth() + 1
    ).padStart(2, '0');


  const dd =
    String(
      today.getDate()
    ).padStart(2, '0');


  dateInput.min =
    `${yyyy}-${mm}-${dd}`;


  /* =========================
     NTH MONDAY
  ========================== */

  function nthMonday(
    year,
    month,
    nth
  ) {

    const firstDay =
      new Date(
        year,
        month - 1,
        1
      ).getDay();


    const firstMonday =
      1 +
      ((8 - firstDay) % 7);


    return (
      firstMonday +
      (nth - 1) * 7
    );

  }


  /* =========================
     VERNAL EQUINOX
  ========================== */

  function vernalEquinox(year) {

    return Math.floor(

      20.8431 +

      0.242194 *
      (year - 1980) -

      Math.floor(
        (year - 1980) / 4
      )

    );

  }


  /* =========================
     AUTUMN EQUINOX
  ========================== */

  function autumnEquinox(year) {

    return Math.floor(

      23.2488 +

      0.242194 *
      (year - 1980) -

      Math.floor(
        (year - 1980) / 4
      )

    );

  }


  /* =========================
     BASE HOLIDAY
  ========================== */

  function isBaseHoliday(date) {

    const year =
      date.getFullYear();

    const month =
      date.getMonth() + 1;

    const day =
      date.getDate();


    const fixedHolidays = [

      [1, 1],

      [2, 11],
      [2, 23],

      [4, 29],

      [5, 3],
      [5, 4],
      [5, 5],

      [8, 11],

      [11, 3],
      [11, 23]

    ];


    if (

      fixedHolidays.some(

        holiday =>

          holiday[0] === month &&
          holiday[1] === day

      )

    ) {

      return true;

    }


    /* 成人の日 */

    if (

      month === 1 &&

      day ===
      nthMonday(
        year,
        1,
        2
      )

    ) {

      return true;

    }


    /* 海の日 */

    if (

      month === 7 &&

      day ===
      nthMonday(
        year,
        7,
        3
      )

    ) {

      return true;

    }


    /* 敬老の日 */

    if (

      month === 9 &&

      day ===
      nthMonday(
        year,
        9,
        3
      )

    ) {

      return true;

    }


    /* スポーツの日 */

    if (

      month === 10 &&

      day ===
      nthMonday(
        year,
        10,
        2
      )

    ) {

      return true;

    }


    /* 春分の日 */

    if (

      month === 3 &&

      day ===
      vernalEquinox(year)

    ) {

      return true;

    }


    /* 秋分の日 */

    if (

      month === 9 &&

      day ===
      autumnEquinox(year)

    ) {

      return true;

    }


    return false;

  }


  /* =========================
     JAPANESE HOLIDAY
  ========================== */

  function isJapaneseHoliday(date) {


    if (
      isBaseHoliday(date)
    ) {

      return true;

    }


    /*
      振替休日
    */

    const check =
      new Date(date);


    check.setDate(
      check.getDate() - 1
    );


    while (
      check.getDay() !== 0
    ) {

      if (
        !isBaseHoliday(check)
      ) {

        break;

      }


      check.setDate(
        check.getDate() - 1
      );

    }


    if (

      check.getDay() === 0 &&

      isBaseHoliday(check)

    ) {

      return true;

    }


    /*
      国民の休日
    */

    const before =
      new Date(date);

    before.setDate(
      before.getDate() - 1
    );


    const after =
      new Date(date);

    after.setDate(
      after.getDate() + 1
    );


    if (

      isBaseHoliday(before) &&

      isBaseHoliday(after)

    ) {

      return true;

    }


    return false;

  }


  /* =========================
     YEAR END / NEW YEAR
  ========================== */

  function isYearEndNewYearHoliday(
    date
  ) {

    const year =
      date.getFullYear();

    const month =
      date.getMonth() + 1;

    const day =
      date.getDate();


    /*
      1月1日〜1月6日
    */

    if (

      month === 1 &&
      day >= 1 &&
      day <= 6

    ) {

      return true;

    }


    /*
      12月の最終土曜日
      〜12月31日
    */

    if (
      month === 12
    ) {

      const lastSaturday =
        new Date(
          year,
          11,
          31
        );


      while (
        lastSaturday.getDay() !== 6
      ) {

        lastSaturday.setDate(

          lastSaturday.getDate() - 1

        );

      }


      const selected =
        new Date(
          year,
          11,
          day
        );


      if (
        selected >= lastSaturday
      ) {

        return true;

      }

    }


    return false;

  }


  /* =========================
     CLOSED DAY
  ========================== */

  function isClosedDay(date) {

    const weekday =
      date.getDay();


    /*
      土日
    */

    if (

      weekday === 0 ||
      weekday === 6

    ) {

      return true;

    }


    /*
      祝日
    */

    if (
      isJapaneseHoliday(date)
    ) {

      return true;

    }


    /*
      年末年始
    */

    if (
      isYearEndNewYearHoliday(date)
    ) {

      return true;

    }


    return false;

  }


  /* =========================
     DATE CHANGE
  ========================== */

  dateInput.addEventListener(
    'change',
    function () {

      hideError();


      if (
        !this.value
      ) {

        return;

      }


      const parts =
        this.value.split('-');


      const selectedDate =
        new Date(

          Number(parts[0]),

          Number(parts[1]) - 1,

          Number(parts[2])

        );


      /*
        年末年始
      */

      if (
        isYearEndNewYearHoliday(
          selectedDate
        )
      ) {

        this.value = '';

        showError(
          '年末年始休業のため、ご予約いただけません。'
        );

        return;

      }


      /*
        土日
      */

      const weekday =
        selectedDate.getDay();


      if (

        weekday === 0 ||
        weekday === 6

      ) {

        this.value = '';

        showError(
          '土曜日・日曜日は定休日のため、ご予約いただけません。'
        );

        return;

      }


      /*
        祝日
      */

      if (
        isJapaneseHoliday(
          selectedDate
        )
      ) {

        this.value = '';

        showError(
          '祝日は定休日のため、ご予約いただけません。'
        );

        return;

      }

    }

  );


  /* =========================
     SEND
  ========================== */

  async function sendReservation() {


    hideError();


    const date =
      document.getElementById(
        'date'
      ).value;


    const time =
      document.getElementById(
        'time'
      ).value;


    const people =
      document.getElementById(
        'people'
      ).value;


    const name =
      document.getElementById(
        'name'
      ).value.trim();


    /*
      入力確認
    */

    if (

      !date ||
      !time ||
      !people ||
      !name

    ) {

      showError(
        'すべての項目をご入力ください。'
      );

      return;

    }


    /*
      日付
    */

    const dateParts =
      date.split('-');


    const selectedDate =
      new Date(

        Number(dateParts[0]),

        Number(dateParts[1]) - 1,

        Number(dateParts[2])

      );


    /*
      休業日再確認
    */

    if (
      isClosedDay(
        selectedDate
      )
    ) {

      showError(
        '選択された日は定休日です。別の日をお選びください。'
      );

      return;

    }


    /*
      LINE内確認
    */

    if (
      !liff.isInClient()
    ) {

      showError(
        'LINEアプリから予約フォームを開いてください。'
      );

      return;

    }


    /*
      表示日
    */

    const formattedDate =

      Number(dateParts[0]) +
      '年' +

      Number(dateParts[1]) +
      '月' +

      Number(dateParts[2]) +
      '日';


    /*
      送信メッセージ
    */

    const message =

`【UZU ご予約希望】

希望日：${formattedDate}
希望時間：${time}
人数：${people}名
お名前：${name}

※店舗からの返信をもって予約確定となります。`;


    const button =
      document.getElementById(
        'sendButton'
      );


    button.disabled = true;

    button.textContent =
      '送信しています…';


    try {


      await liff.sendMessages([

        {
          type: 'text',
          text: message
        }

      ]);


      document
        .getElementById(
          'formArea'
        )
        .style
        .display =
        'none';


      document
        .getElementById(
          'successArea'
        )
        .style
        .display =
        'block';


      window.scrollTo({

        top: 0,

        behavior: 'smooth'

      });


    } catch (error) {


      console.error(error);


      button.disabled = false;

      button.textContent =
        'LINEで予約希望を送信';


      showError(
        '送信できませんでした。もう一度お試しください。'
      );

    }

  }


  /* =========================
     ERROR
  ========================== */

  function showError(message) {

    const area =
      document.getElementById(
        'error'
      );


    area.textContent =
      message;


    area.style.display =
      'block';

  }


  function hideError() {

    const area =
      document.getElementById(
        'error'
      );


    area.style.display =
      'none';


    area.textContent =
      '';

  }


  /* =========================
     START
  ========================== */

  window.addEventListener(
    'load',
    initializeLiff
  );


</script>


</body>

</html>
