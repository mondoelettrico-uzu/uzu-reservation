<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>UZU ご予約</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    :root {
      --uzu-yellow: #ffcc00;
      --uzu-dark: #222222;
      --uzu-green: #06c755;
      --uzu-error: #b33a2b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 8px 18px 60px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Noto Sans JP",
        sans-serif;

      background: var(--uzu-yellow);
      color: var(--uzu-dark);
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }


    /* =========================
       LOGO
    ========================== */

    .logo-area {
      text-align: center;
      margin: 0 auto;
    }

    .main-logo {
      display: block;
      width: 100px;
      height: auto;
      margin: 6px auto 4px;
    }


    /* =========================
       TITLE
    ========================== */

    .reservation-title {
      text-align: center;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin: 0 0 16px;
    }


    /* =========================
       FORM CARD
    ========================== */

    .form-card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 18px;
      padding: 25px 20px 27px;

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.08);
    }


    /* =========================
       FIELDS
    ========================== */

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;

      border: 1px solid #d8d4ca;
      border-radius: 9px;

      background: #ffffff;
      color: #222222;

      font-size: 16px;
      font-family: inherit;

      -webkit-appearance: none;
      appearance: none;
    }

    input,
    select {
      height: 54px;
      padding: 0 14px;
    }

    textarea {
      height: 100px;
      padding: 14px;
      line-height: 1.6;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #777777;
    }

    select {
      background-image:
        linear-gradient(
          45deg,
          transparent 50%,
          #555 50%
        ),
        linear-gradient(
          135deg,
          #555 50%,
          transparent 50%
        );

      background-position:
        calc(100% - 20px) 23px,
        calc(100% - 14px) 23px;

      background-size:
        6px 6px,
        6px 6px;

      background-repeat: no-repeat;
    }


    /* =========================
       DATE INFO
    ========================== */

    .holiday-note {
      margin: -9px 0 21px;
      font-size: 12px;
      line-height: 1.7;
      color: #777777;
    }

    .date-error {
      display: none;

      margin-top: 9px;
      padding: 10px 12px;

      background: #fff0ee;

      border-radius: 7px;

      color: var(--uzu-error);

      font-size: 13px;
      font-weight: 600;
      line-height: 1.6;
    }

    .optional {
      font-weight: normal;
      color: #888888;
    }


    /* =========================
       BUTTON
    ========================== */

    .send-button {
      width: 100%;
      height: 60px;
      margin-top: 4px;

      border: none;
      border-radius: 10px;

      background: var(--uzu-green);
      color: #ffffff;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;
    }

    .send-button:disabled {
      opacity: 0.55;
      cursor: default;
    }


    /* =========================
       NOTICE
    ========================== */

    .notice {
      margin-top: 18px;
      padding: 14px;

      background: #f7f7f4;
      border-radius: 8px;

      font-size: 12px;
      line-height: 1.8;

      color: #555555;
    }


    /* =========================
       GENERAL ERROR
    ========================== */

    .error {
      display: none;

      margin-top: 16px;
      padding: 13px 14px;

      border-radius: 8px;

      background: #fff0ee;
      color: var(--uzu-error);

      font-size: 13px;
      line-height: 1.7;
    }


    /* =========================
       SUCCESS
    ========================== */

    .success {
      display: none;

      background:
        rgba(255, 255, 255, 0.96);

      border-radius: 18px;

      margin-top: 20px;
      padding: 40px 22px;

      text-align: center;

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.08);
    }

    .success-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .success-text {
      font-size: 14px;
      line-height: 1.9;
    }

  </style>

</head>


<body>

<div class="container">


  <!-- LOGO -->

  <div class="logo-area">

    <img
      src="uzulogo黄色.png"
      class="main-logo"
      alt="UZU FARM & TABLE">

  </div>


  <!-- FORM -->

  <div id="formArea">


    <div class="reservation-title">
      ご予約
    </div>


    <div class="form-card">


      <!-- DATE -->

      <div class="field">

        <label for="date">
          ご希望日
        </label>

        <input
          type="date"
          id="date">

        <div
          id="dateError"
          class="date-error">
        </div>

      </div>


      <div class="holiday-note">
        ※ご予約は当日〜2か月先まで承っております。<br>
        ※土日祝・年末年始はご予約いただけません。
      </div>


      <!-- TIME -->

      <div class="field">

        <label for="time">
          ご希望時間
        </label>

        <select id="time">

          <option value="">
            選択してください
          </option>

          <option value="11:00">11:00</option>
          <option value="11:30">11:30</option>
          <option value="12:00">12:00</option>
          <option value="12:30">12:30</option>
          <option value="13:00">13:00</option>
          <option value="13:30">13:30</option>
          <option value="14:00">14:00</option>

        </select>

      </div>


      <!-- PEOPLE -->

      <div class="field">

        <label for="people">
          人数
        </label>

        <select id="people">

          <option value="">
            選択してください
          </option>

          <option value="1">1名</option>
          <option value="2">2名</option>
          <option value="3">3名</option>
          <option value="4">4名</option>
          <option value="5">5名</option>
          <option value="6">6名</option>
          <option value="7">7名</option>
          <option value="8">8名</option>
          <option value="9">9名</option>
          <option value="10">10名</option>

        </select>

      </div>


      <!-- NAME -->

      <div class="field">

        <label for="name">
          お名前
        </label>

        <input
          type="text"
          id="name"
          placeholder="例：山田 太郎"
          autocomplete="name">

      </div>


      <!-- REMARKS -->

      <div class="field">

        <label for="remarks">

          備考

          <span class="optional">
            （任意）
          </span>

        </label>

        <textarea
          id="remarks"
          placeholder="アレルギー・お子様連れ・その他ご要望など"></textarea>

      </div>


      <!-- SEND -->

      <button
        id="sendButton"
        class="send-button"
        onclick="sendReservation()">

        LINEで予約希望を送信

      </button>


      <!-- GENERAL ERROR -->

      <div
        id="error"
        class="error">
      </div>


      <!-- NOTICE -->

      <div class="notice">

        ※ご予約は、店舗からの返信をもって確定となります。<br><br>

        当日のご予約も承っておりますが、営業中はすぐに返信できない場合がございます。あらかじめご了承ください。

      </div>


    </div>

  </div>


  <!-- SUCCESS -->

  <div
    id="successArea"
    class="success">


    <div class="success-title">
      ご予約希望を送信しました
    </div>


    <div class="success-text">

      ありがとうございます。<br><br>

      店舗で内容を確認後、<br>
      LINEよりご返信いたします。<br><br>

      店舗からの返信をもって<br>
      ご予約確定となります。<br><br>

      営業中は返信までお時間をいただく場合がございます。

    </div>


  </div>


</div>


<script>


    /* =========================
     LIFF
  ========================== */

  const LIFF_IDS = {
    dev: '2011685472-ftHOwEec',
    review: '2011685473-ITYBYAI6',
    prod: '2011685474-HAW2JHZi'
  };


  function getLiffEnvironment() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const env =
      params.get('env');

    if (
      env === 'dev' ||
      env === 'review' ||
      env === 'prod'
    ) {

      sessionStorage.setItem(
        'uzuLiffEnv',
        env
      );

      return env;

    }


    const savedEnv =
      sessionStorage.getItem(
        'uzuLiffEnv'
      );

    if (
      savedEnv === 'dev' ||
      savedEnv === 'review' ||
      savedEnv === 'prod'
    ) {

      return savedEnv;

    }


    /*
      env指定がない通常アクセスは
      本番環境として扱う
    */

    return 'prod';

  }


  const LIFF_ENV =
    getLiffEnvironment();


  const LIFF_ID =
    LIFF_IDS[LIFF_ENV];


  async function initializeLiff() {

    try {

      await liff.init({
        liffId: LIFF_ID
      });

    } catch (error) {

      console.error(
        'LIFF initialization failed',
        error
      );

      showError(
        'LINEとの接続に失敗しました。画面を閉じて、もう一度お試しください。'
      );

    }

  }

  /* =========================
     DATE SETTINGS
  ========================== */

  const dateInput =
    document.getElementById('date');


  /*
    時刻部分の影響を受けないよう
    今日の0:00に統一
  */

  const today =
    new Date();

  today.setHours(
    0,
    0,
    0,
    0
  );


  /*
    YYYY-MM-DD形式
  */

  function formatDateForInput(date) {

    const year =
      date.getFullYear();

    const month =
      String(
        date.getMonth() + 1
      ).padStart(2, '0');

    const day =
      String(
        date.getDate()
      ).padStart(2, '0');

    return (
      year +
      '-' +
      month +
      '-' +
      day
    );

  }


  /*
    当日から
  */

  const minReservationDate =
    new Date(today);


  /*
    2か月先まで
  */

  const maxReservationDate =
    new Date(

      today.getFullYear(),

      today.getMonth() + 2,

      today.getDate()

    );


  /*
    HTMLの日付欄にも
    min / max を設定
  */

  dateInput.min =
    formatDateForInput(
      minReservationDate
    );


  dateInput.max =
    formatDateForInput(
      maxReservationDate
    );


  /* =========================
     STRING → DATE
  ========================== */

  function parseInputDate(
    value
  ) {

    if (!value) {
      return null;
    }


    const parts =
      value.split('-');


    const date =
      new Date(

        Number(parts[0]),

        Number(parts[1]) - 1,

        Number(parts[2])

      );


    date.setHours(
      0,
      0,
      0,
      0
    );


    return date;

  }


  /* =========================
     NTH MONDAY
  ========================== */

  function nthMonday(
    year,
    month,
    nth
  ) {

    const firstDay =
      new Date(
        year,
        month - 1,
        1
      ).getDay();


    const firstMonday =
      1 +
      ((8 - firstDay) % 7);


    return (
      firstMonday +
      (nth - 1) * 7
    );

  }


  /* =========================
     EQUINOX
  ========================== */

  function vernalEquinox(year) {

    return Math.floor(

      20.8431 +

      0.242194 *
      (year - 1980) -

      Math.floor(
        (year - 1980) / 4
      )

    );

  }


  function autumnEquinox(year) {

    return Math.floor(

      23.2488 +

      0.242194 *
      (year - 1980) -

      Math.floor(
        (year - 1980) / 4
      )

    );

  }


  /* =========================
     BASE HOLIDAY
  ========================== */

  function isBaseHoliday(date) {

    const year =
      date.getFullYear();

    const month =
      date.getMonth() + 1;

    const day =
      date.getDate();


    const fixedHolidays = [

      [1, 1],

      [2, 11],
      [2, 23],

      [4, 29],

      [5, 3],
      [5, 4],
      [5, 5],

      [8, 11],

      [11, 3],
      [11, 23]

    ];


    if (

      fixedHolidays.some(

        holiday =>

          holiday[0] === month &&
          holiday[1] === day

      )

    ) {

      return true;

    }


    /* 成人の日 */

    if (

      month === 1 &&

      day ===
      nthMonday(
        year,
        1,
        2
      )

    ) {

      return true;

    }


    /* 海の日 */

    if (

      month === 7 &&

      day ===
      nthMonday(
        year,
        7,
        3
      )

    ) {

      return true;

    }


    /* 敬老の日 */

    if (

      month === 9 &&

      day ===
      nthMonday(
        year,
        9,
        3
      )

    ) {

      return true;

    }


    /* スポーツの日 */

    if (

      month === 10 &&

      day ===
      nthMonday(
        year,
        10,
        2
      )

    ) {

      return true;

    }


    /* 春分の日 */

    if (

      month === 3 &&

      day ===
      vernalEquinox(year)

    ) {

      return true;

    }


    /* 秋分の日 */

    if (

      month === 9 &&

      day ===
      autumnEquinox(year)

    ) {

      return true;

    }


    return false;

  }


  /* =========================
     JAPANESE HOLIDAY
  ========================== */

  function isJapaneseHoliday(date) {


    /*
      通常の祝日
    */

    if (
      isBaseHoliday(date)
    ) {

      return true;

    }


    /*
      振替休日

      前日以前を遡り、
      日曜日の祝日から
      連続している場合を確認
    */

    const check =
      new Date(date);


    check.setDate(
      check.getDate() - 1
    );


    while (
      isBaseHoliday(check)
    ) {

      if (
        check.getDay() === 0
      ) {

        return true;

      }


      check.setDate(
        check.getDate() - 1
      );

    }


    /*
      国民の休日

      前後が祝日の場合
    */

    const before =
      new Date(date);

    before.setDate(
      before.getDate() - 1
    );


    const after =
      new Date(date);

    after.setDate(
      after.getDate() + 1
    );


    if (

      isBaseHoliday(before) &&
      isBaseHoliday(after)

    ) {

      return true;

    }


    return false;

  }


  /* =========================
     YEAR END / NEW YEAR
  ========================== */

  function isYearEndNewYearHoliday(
    date
  ) {

    const year =
      date.getFullYear();

    const month =
      date.getMonth() + 1;

    const day =
      date.getDate();


    /*
      1月1日〜1月6日
    */

    if (

      month === 1 &&
      day >= 1 &&
      day <= 6

    ) {

      return true;

    }


    /*
      12月の最終土曜日
      〜12月31日
    */

    if (
      month === 12
    ) {

      const lastSaturday =
        new Date(
          year,
          11,
          31
        );


      while (
        lastSaturday.getDay() !== 6
      ) {

        lastSaturday.setDate(

          lastSaturday.getDate() - 1

        );

      }


      if (
        date >= lastSaturday
      ) {

        return true;

      }

    }


    return false;

  }


  /* =========================
     DATE VALIDATION
  ========================== */

  function validateReservationDate(
    date
  ) {


    if (!date) {

      return {
        valid: false,
        message:
          'ご希望日を選択してください。'
      };

    }


    /*
      過去
    */

    if (
      date < minReservationDate
    ) {

      return {
        valid: false,
        message:
          '過去の日付はご予約いただけません。'
      };

    }


    /*
      2か月より先
    */

    if (
      date > maxReservationDate
    ) {

      return {
        valid: false,
        message:
          'ご予約は2か月先まで承っております。'
      };

    }


    /*
      年末年始
    */

    if (
      isYearEndNewYearHoliday(date)
    ) {

      return {
        valid: false,
        message:
          '年末年始休業のため、ご予約いただけません。'
      };

    }


    /*
      土日
    */

    const weekday =
      date.getDay();


    if (

      weekday === 0 ||
      weekday === 6

    ) {

      return {
        valid: false,
        message:
          '土日・祝日は定休日のため、ご予約いただけません。'
      };

    }


    /*
      祝日
    */

    if (
      isJapaneseHoliday(date)
    ) {

      return {
        valid: false,
        message:
          '祝日は定休日のため、ご予約いただけません。'
      };

    }


    return {
      valid: true,
      message: ''
    };

  }


  /* =========================
     DATE ERROR
  ========================== */

  function showDateError(
    message
  ) {

    const area =
      document.getElementById(
        'dateError'
      );


    area.textContent =
      message;


    area.style.display =
      'block';

  }


  function hideDateError() {

    const area =
      document.getElementById(
        'dateError'
      );


    area.textContent =
      '';


    area.style.display =
      'none';

  }


  /* =========================
     DATE CHANGE
  ========================== */

  dateInput.addEventListener(
    'change',
    function () {


      hideDateError();
      hideError();


      if (
        !this.value
      ) {

        return;

      }


      const selectedDate =
        parseInputDate(
          this.value
        );


      const result =
        validateReservationDate(
          selectedDate
        );


      if (
        !result.valid
      ) {

        /*
          エラー理由を先に表示
        */

        showDateError(
          result.message
        );


        /*
          無効な日付は解除
        */

        this.value = '';

        return;

      }

    }

  );


  /* =========================
     SEND
  ========================== */

  async function sendReservation() {


    hideError();


    const dateValue =
      document.getElementById(
        'date'
      ).value;


    const time =
      document.getElementById(
        'time'
      ).value;


    const people =
      document.getElementById(
        'people'
      ).value;


    const name =
      document.getElementById(
        'name'
      ).value.trim();


    const remarks =
      document.getElementById(
        'remarks'
      ).value.trim();


    /*
      日付確認
    */

    if (
      !dateValue
    ) {

      showDateError(
        'ご希望日を選択してください。'
      );

      return;

    }


    /*
      日付をJavaScriptでも
      必ず再チェック
    */

    const selectedDate =
      parseInputDate(
        dateValue
      );


    const dateResult =
      validateReservationDate(
        selectedDate
      );


    if (
      !dateResult.valid
    ) {

      showDateError(
        dateResult.message
      );

      dateInput.value = '';

      return;

    }


    hideDateError();


    /*
      その他必須項目
    */

    if (
      !time
    ) {

      showError(
        'ご希望時間を選択してください。'
      );

      return;

    }


    if (
      !people
    ) {

      showError(
        '人数を選択してください。'
      );

      return;

    }


    if (
      !name
    ) {

      showError(
        'お名前をご入力ください。'
      );

      return;

    }


    /*
      LINEアプリ内か確認
    */

    if (
      !liff.isInClient()
    ) {

      showError(
        'LINEアプリから予約フォームを開いてください。'
      );

      return;

    }


    /*
      表示用日付
    */

    const dateParts =
      dateValue.split('-');


    const formattedDate =

      Number(dateParts[0]) +
      '年' +

      Number(dateParts[1]) +
      '月' +

      Number(dateParts[2]) +
      '日';


    /*
      LINE送信メッセージ
    */

    const message =

`【UZU ご予約希望】

希望日：${formattedDate}
希望時間：${time}
人数：${people}名
お名前：${name}
備考：${remarks || 'なし'}

※店舗からの返信をもって予約確定となります。`;


    const button =
      document.getElementById(
        'sendButton'
      );


    button.disabled = true;

    button.textContent =
      '送信しています…';


    try {


      await liff.sendMessages([

        {
          type: 'text',
          text: message
        }

      ]);


      document
        .getElementById(
          'formArea'
        )
        .style
        .display =
        'none';


      document
        .getElementById(
          'successArea'
        )
        .style
        .display =
        'block';


      window.scrollTo({

        top: 0,

        behavior: 'smooth'

      });


    } catch (error) {


      console.error(error);


      button.disabled = false;

      button.textContent =
        'LINEで予約希望を送信';


      showError(
        '送信できませんでした。もう一度お試しください。'
      );

    }

  }


  /* =========================
     GENERAL ERROR
  ========================== */

  function showError(
    message
  ) {

    const area =
      document.getElementById(
        'error'
      );


    area.textContent =
      message;


    area.style.display =
      'block';

  }


  function hideError() {

    const area =
      document.getElementById(
        'error'
      );


    area.textContent =
      '';


    area.style.display =
      'none';

  }


  /* =========================
     START
  ========================== */

  window.addEventListener(
    'load',
    initializeLiff
  );


</script>
